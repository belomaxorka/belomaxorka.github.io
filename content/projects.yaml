  desc: {en: torrent tracker engine in php. i maintain it., ru: движок торрент-трекера на php. мейнтейню.}
- name: get.tp.dev
  link: https://get.torrentpier.dev
  led: blink s2
  desc: {en: "download center: 129 builds, each checked by sha256.", ru: "центр загрузок: 129 сборок, каждая сверена по sha256."}
