# Корзины дисков = проекты. Порядок здесь — порядок на сайте.
#   name — надпись на ленте (строка или {en, ru}), desc — описание под ней (строка или {en, ru}),
#   link — куда ведёт (без него корзина не кликается),
#   tape — цвет ленты: пусто (чёрная), r (красная), b (синяя),
#   led — лампа: blink, "blink s2", "blink s3" (мигает с разной частотой), on, warn, off.
- name: torrentpier
