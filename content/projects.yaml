# The /projects rack (templates/units/projects.html): a unit per repository, in this order, top to bottom.
# Everything the unit shows (description, topics, language, licence, stars, the latest release, the last commit, the
# site) is what GitHub says of the repository: site-api reads it every 30 minutes, a new one on its next round.
#   repo - owner/name on GitHub;
#   tape - the nameplate's colour: empty (black), r (red), b (blue).
- repo: yaopl/yaopl
  tape: r

- repo: torrentpier/torrentpier
  tape: b
