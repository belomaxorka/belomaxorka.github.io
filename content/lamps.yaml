# Short captions of the monitoring lamps: the check's name in Gatus (infra gatus/config.yaml) -> the text under the lamp.
# A new check without a line here captions itself: the name in lower case without the brackets
# ("Proxmox" -> proxmox, "Notes (Memos)" -> notes).
labels:
  belomaxorka.dev: site
  Site (light, http): lite
  Site (Tor): tor
  Site (Yggdrasil): ygg
  Blog: blog
  Infra page: infra
  Site API: api
  Git (Forgejo): git
  Vault (Vaultwarden): vault
  Paste (rustypaste): paste
  IT Tools: tools
  Notes (Memos): memos
  Gists (Opengist): gist
  Coding stats (Wakapi): waka
  Analytics (Umami): stats
  Notifications (ntfy): ntfy
  Scrobbles (Koito): fm
  Status page: status
  Proxmox: proxmox
  Backup server (PBS): pbs
  Reverse proxy (Caddy): caddy
  i2pd router: i2pd
  i2pd console: i2p ui
