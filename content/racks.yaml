# Ряд стоек: каждая стойка — своя страница, порядок здесь — порядок в проходе (стрелки, ←/→, свайп).
#   id    — имя; подпись на табличке берётся из i18n: rack.<id> (и rack.<id>.sub — строка под ней);
#   path  — адрес страницы; у первой стойки должен быть "/" (на главной наверху кольцо otoring);
#   units — юниты сверху вниз: имя = шаблон templates/units/*.html с {{define "unit-<имя>"}};
#   router — не используется: роутер теперь юнит router (вариант B: patch, brush, tor, router сверху стойки);
#   stub  — стойку ещё монтируют: вместо юнитов заглушки.
# Новый юнит в стойке — строка здесь (и шаблон lite-<имя> для лёгкой версии, templates/lite); новая стойка — блок
# здесь и две подписи в i18n, без Go: rack.<id> и rack.<id>.sub. Описание и картинка превью у сайта одни на все
# стойки (meta.desc, assets/og/site.png). В /sitemap.xml стойка попадает сама, заглушка (stub) — нет, и у неё noindex.
- id: home
  path: /
  units: [patch, brush, tor, brush, router, mgmt, server, media, monitor, syslog, switch, donate, kvm, buttons, blank, ups]

- id: lab
  path: /lab
  units: [patch, brush, tor, brush, mgmt, pve, guests, monitor, ups]

- id: fun
  path: /fun
  stub: true
  units: [patch, brush, tor, brush, mgmt, ups]

- id: archive
  path: /archive
  stub: true
  units: [patch, brush, tor, brush, mgmt, ups]
