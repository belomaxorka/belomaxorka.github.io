# The row of racks: each rack is a page of its own, in the aisle's order (the arrows, the arrow keys, a swipe).
#   id    - the name; the sign's caption comes from i18n: rack.<id> (and rack.<id>.sub, the line under it);
#   path  - the page's address; the first rack must be "/" (the home page has the otoring ring on top);
#   units - the units from top to bottom: a name is a template in templates/units/*.html with {{define "unit-<name>"}};
#   stub  - the rack is still being mounted: blanks instead of units.
# A new unit is a line here and a lite-<name> template; a new rack is a block here and rack.<id>, rack.<id>.sub in
# both i18n files.
- id: home
  path: /
  units: [patch, brush, tor, brush, router, mgmt, server, media, monitor, syslog, activity, tokens, switch, kvm, buttons, blank, ups]

- id: lab
  path: /lab
  units: [patch, brush, tor, brush, mgmt, pve, guests, monitor, ups]
