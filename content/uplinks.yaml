# The ways into the site: the main one and the spare uplinks (the router on R1, the light version). All lead to the
# same site-api.
#   id   - the name: web, lite, tor, ygg. By id: for tor site-api sends url in the Onion-Location header (Tor Browser
#          offers the onion address), lite is "you are here" in the light version;
#   port - the tape on the router's jack (no port, no jack: that is https itself); name the caption; url the address;
#          note what it is for (a string or {en, ru}); check the Gatus check (infra gatus/config.yaml) that lights
#          the way's lamp. Tor and Yggdrasil have none: Gatus on the VDS is in neither network, so no lamp.
# Where they come from: CT120 uplinks (Tor and Yggdrasil) and lite.belomaxorka.dev (Caddy, http without a redirect), infra/uplinks.
- id: web
  check: belomaxorka.dev
  name: https
  url: https://belomaxorka.dev
  note: {en: "the internet, through cloudflare", ru: "интернет, через cloudflare"}
- id: tor
  port: tor
  name: tor
  url: http://belomahi5ltqfhdrpqjlivzwycawvllixi3lksfnhpyzfsk2nngnydid.onion
  note: {en: "onion service, open in tor browser", ru: "onion-сервис, открывать в tor browser"}
- id: ygg
  port: ygg
  name: yggdrasil
  url: http://[200:88bc:4f5d:30b5:52c0:3b61:6d30:a916]/
  note: {en: "the yggdrasil mesh network", ru: "mesh-сеть yggdrasil"}
- id: lite
  port: http
  check: Site (light, http)
  name: http 1.0
  url: http://lite.belomaxorka.dev
  note: {en: "html 4.01 for old browsers: netscape, internet explorer, lynx", ru: "html 4.01 для старых браузеров: netscape, internet explorer, lynx"}
