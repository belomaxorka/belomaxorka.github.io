# The profile on the server unit. Texts are i18n keys (t), what is not translated as it is (text).
#   birthday - site-api counts the age and "birthday in N days" from it (in the site's time zone);
#   tapes    - the rows of tapes under the name: t an i18n key, text the caption as it is, age the age,
#              color the tape's colour: empty (grey), r (red), b (blue);
#   person   - who I am for search engines and link previews (the home page's <head>: og profile, JSON-LD Person),
#              not shown on the page. The links to my profiles (sameAs) are the switch's ports with me: true in contacts.yaml.
birthday: "2006-05-25"
# mbti — the personality type: a tape under the name (mbti: true in tapes) and a frame of the server's LCD.
mbti: infp-t
person:
  first: Roman
  last: Kelesidis
  username: belomaxorka
  job: full-stack web developer
# colors - favourite colours: squares on the server's LCD, taking turns with the other frames.
# pgp - the whole PGP key fingerprint: the asset tag on the server, its last 8 characters on the LCD. Only the
#   fingerprint: the key itself (it holds an e-mail address) is not published.
colors: ["#000", "#fff", "#a062de", "#62a0de"]
pgp: "139C 8E4A 1A2B 4823 3AE3 EFEF D815 7C4D 4C4C 6DB4"
# age - the public key for age (age-encryption.org): anyone can encrypt a file to me with it. A second sticker under
#   the PGP one. The private key never leaves my machine.
age: "age17qp94tl4mxjecknypsjzdezu43fwlsllselhraewmdhfjyw84ynsk94609"
# keys - where my public SSH key is (the file `keys` at the site's root, like github.com/<user>.keys): a third
#   sticker with the one-liner that lets me into a server. The private key never leaves my machine.
keys: https://belomaxorka.dev/keys
tapes:
  - - {t: me.pronouns}
    - {age: true}
    - {mbti: true, color: r}
    - {text: ru · en}
  - - {t: me.fullstack, color: b}
    - {text: laravel, color: b}
    - {text: vue · react, color: b}
  - - {t: me.devops}
    - {t: me.network}
    - {t: me.homelab}
