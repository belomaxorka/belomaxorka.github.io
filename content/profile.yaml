# Профиль на юните-сервере. Тексты — ключи i18n (t), непереводимое — как есть (text).
#   birthday — по нему site-api считает возраст и «день рождения через N дней» (по времени Барнаула);
#   tapes    — ряды лент под именем: t — ключ i18n, text — надпись как есть, age — возраст,
#              color — цвет ленты: пусто (серая), r (красная), b (синяя);
#   person   — кто я для поисковиков и превью ссылок (<head> главной: og profile, JSON-LD Person), на странице
#              не видно. Ссылки на мои профили (sameAs) — порты свитча с me: true в contacts.yaml.
birthday: "2006-05-25"
person:
  first: {en: Roman, ru: Роман}
  last: {en: Kelesidis, ru: Келесидис}
  username: belomaxorka
  job: {en: full-stack web developer, ru: фулстек веб-разработчик}
# colors — любимые цвета (как на старом сайте): квадраты на ЖК сервера, по очереди с остальными кадрами.
# pgp — отпечаток ключа PGP целиком: наклейка инвентарного номера на сервере, на ЖК — последние 8 знаков. Только
#   отпечаток: сам ключ (в нём почта) не публикуется.
colors: ["#000", "#fff", "#a062de", "#62a0de"]
pgp: "139C 8E4A 1A2B 4823 3AE3 EFEF D815 7C4D 4C4C 6DB4"
tapes:
  - - {t: me.pronouns}
    - {age: true}
    - {text: infp-t, color: r}
    - {text: ru · en}
  - - {t: me.fullstack, color: b}
    - {text: laravel, color: b}
    - {text: vue · react, color: b}
  - - {t: me.devops}
    - {t: me.network}
    - {t: me.homelab}
