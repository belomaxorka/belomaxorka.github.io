# The meme wall on infra.belomaxorka.dev (templates/infra.html): "hosting as we know it".
# The pictures are content/memes/: drop in a file (jpg, png, gif, webp) and push, nothing else is needed.
# Ordered by the date in the file name, newest first: Telegram saves photo_2026-10-12_02-11-28.jpg, your own can be
# named 2026-02-20_anything.jpg; without a date at the end, by name. 24 a page, then "older ->".
