# The token meter (templates/units/tokens.html): what Claude Code burned on my machines, as they report it to site-api.
# Prices in USD per million tokens, for "what it would have cost at API prices"; a model not listed costs as default.
prices:
  default: {input: 4, output: 20, cache_read: 0.2, cache_write: 5}
  claude-opus-5-5: {input: 4, output: 20, cache_read: 0.2, cache_write: 5}
  claude-fable-5-1: {input: 10, output: 50, cache_read: 0.25, cache_write: 12.5}
  claude-opus-4-8: {input: 5, output: 25, cache_read: 0.5, cache_write: 6.25}
  claude-sonnet-5-5: {input: 2, output: 10, cache_read: 0.2, cache_write: 2.5}
  claude-haiku-5-5: {input: 0.1, output: 0.5, cache_read: 0.01, cache_write: 0.125}
