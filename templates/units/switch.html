{{/* The contacts switch; the list is content/contacts.yaml. */}}
{{define "unit-switch"}}
<nav class="u sw" style="--h:1" aria-label="{{t "sw.aria"}}">
  <div class="face">
    <span class="silk">{{t "sw.title"}}</span>
    <div class="ports">
      {{range .Content.contacts}}{{if and .link (or (not .needs) $.HasCV)}}<a class="port" href="{{.link}}"{{if .me}}{{ext .link "me"}}{{else}}{{ext .link}}{{end}}{{if not .needs}}{{with .title}} title="{{loc .}}"{{end}}{{end}}><i class="jack"></i><span class="tape{{with .tape}} {{.}}{{end}}">{{loc .name}}</span><i class="led{{with .led}} {{.}}{{end}}"></i></a>{{else if .copy}}<button class="port" type="button" x-data="copyName" data-name="{{.copy}}" title="{{.copy}} · {{t "sw.copy"}}" :class="{ shown: shown, copied: copied }" @click="copy"><i class="jack"></i><span class="tape swap{{with .tape}} {{.}}{{end}}"><span>{{loc .name}}</span><span class="alt">{{.copy}}<i> ✓</i></span></span><i class="led{{with .led}} {{.}}{{end}}"></i></button>{{else}}<span class="port off"{{with .title}} title="{{loc .}}"{{end}}><i class="jack"></i><span class="tape{{with .tape}} {{.}}{{end}}">{{loc .name}}</span><i class="led off"></i></span>{{end}}
      {{end}}
    </div>
  </div>
</nav>
{{end}}
