{{/* The contacts switch; the list is content/contacts.yaml. */}}
{{define "unit-switch"}}
<nav class="u sw" style="--h:1" aria-label="{{t "sw.aria"}}" data-key="sw" data-power data-net="wan">
  <div class="face">
    <span class="silk">{{t "sw.title"}}</span>
    <div class="ports">
      {{range $i, $_ := .Content.contacts}}{{if .link}}<a class="port" style="--i: {{$i}}" href="{{.link}}"{{if .me}}{{ext .link "me"}}{{else}}{{ext .link}}{{end}}{{with .title}} title="{{.}}"{{end}}><i class="jack"></i><span class="tape{{with .tape}} {{.}}{{end}}">{{.name}}</span><i class="led{{with .led}} {{.}}{{end}}"></i></a>{{else if .copy}}<button class="port" style="--i: {{$i}}" type="button" x-data="copyName" data-name="{{.copy}}" title="{{.copy}} · {{t "sw.copy"}}" :class="{ shown: shown, copied: copied }" @click="copy"><i class="jack"></i><span class="tape swap{{with .tape}} {{.}}{{end}}"><span>{{.name}}</span><span class="alt">{{.copy}}<i> ✓</i></span></span><i class="led{{with .led}} {{.}}{{end}}"></i></button>{{else}}<span class="port off" style="--i: {{$i}}"{{with .title}} title="{{.}}"{{end}}><i class="jack"></i><span class="tape{{with .tape}} {{.}}{{end}}">{{.name}}</span><i class="led off"></i></span>{{end}}
      {{end}}
    </div>
  </div>
</nav>
{{end}}
