{{/* KVM-консоль = гостевая книга. Пока заглушка: бэкенд гостевой ещё не написан. */}}
{{define "unit-kvm"}}
<section class="u kvm" style="--h:4" aria-labelledby="gbh">
  <div class="face">
    <div class="bar"><span class="silk" id="gbh">{{t "gb.title"}}</span><span class="silk">{{t "gb.soon"}}</span></div>
    <div class="screen">
      <p class="empty">{{t "gb.empty"}}</p>
    </div>
    <div class="kb">
      <label for="gbtext" class="silk" style="grid-column: 1 / -1; min-height: 0">{{t "gb.message"}}</label>
      <textarea id="gbtext" placeholder="{{t "gb.placeholder"}}" disabled></textarea>
      <div class="keys"><button class="key" type="button" disabled>{{t "gb.draw"}}</button><button class="key" type="button" disabled>{{t "gb.send"}}</button></div>
    </div>
  </div>
</section>
{{end}}
