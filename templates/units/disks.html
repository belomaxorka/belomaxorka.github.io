{{/* Проекты = корзины дисков. Список — content/projects.yaml. */}}
{{define "unit-disks"}}
<section class="u disks" style="--h:3" aria-label="{{t "disks.aria"}}">
  <div class="face">
    <div class="bays">
      {{range .Content.projects}}{{if .link}}<a class="bay" href="{{.link}}">{{else}}<div class="bay">{{end}}<span class="top"><span class="tape{{with .tape}} {{.}}{{end}}">{{loc .name}}</span><i class="led{{with .led}} {{.}}{{end}}"></i></span><p>{{loc .desc}}</p>{{if .link}}</a>{{else}}</div>{{end}}
      {{end}}
    </div>
  </div>
</section>
{{end}}
