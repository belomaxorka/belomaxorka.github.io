{{/* Management: the sections, the screen and theme toggles (hidden until Alpine
     starts). */}}
{{define "unit-mgmt"}}
<div class="u mgmt" style="--h:1" data-key="mgmt" data-power data-net="wan" data-vlan="mgmt">
  <div class="face">
    <nav class="ports" aria-label="{{t "nav.aria"}}">
      {{range .Content.nav}}{{$href := or (index $.Content.links .link) .link}}<a class="key" href="{{$href}}"{{ext $href}}>{{t .name}}</a>
      {{end}}
    </nav>
    <div class="ports">
      <button class="key" type="button" hidden x-data="lcdToggle" data-cover="{{t "lcd.cover"}}" data-amber="{{t "lcd.amber"}}" @click="toggle" x-text="label">{{t "lcd.cover"}}</button>
      <button class="key" type="button" hidden x-data="themeToggle" data-dark="{{t "theme.dark"}}" data-light="{{t "theme.light"}}" @click="toggle" aria-label="{{t "theme.aria"}}"><i class="led pwr"></i><span x-text="label">{{t "theme.dark"}}</span></button>
      {{/* Sound (sound.js): off by default, no button without JS. */}}
      <button class="key snd" type="button" hidden aria-pressed="false" data-yes="{{t "sound.on"}}" data-no="{{t "sound.off"}}" aria-label="{{t "sound.off"}}" title="{{t "sound.off"}}"><span class="i-on">{{template "icon" "sound"}}</span><span class="i-off">{{template "icon" "mute"}}</span></button>
    </div>
  </div>
</div>
{{end}}
